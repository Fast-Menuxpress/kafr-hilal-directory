<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دليل كفر هلال</title>
<meta name="description" content="محلات وخدمات كفر هلال في مكان واحد. دوّر بالاسم أو بالتصنيف واتصل مباشرة.">

<style>
:root{--blue:#425dae;--blue2:#2f4590;--orange:#e78e1a;--teal:#105979;--ink:#1f2937;--mute:#5b6472;--line:#e3e6ee;--bg:#f3f5fb}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.65}
main{max-width:980px;margin:0 auto;padding:0 14px 48px}
header{text-align:center;background:linear-gradient(160deg,#425dae 0%,#2f4590 70%,#233676 100%);color:#fff;margin:0 -14px 18px;padding:28px 16px 30px;border-radius:0 0 28px 28px;box-shadow:0 8px 24px rgba(47,69,144,.25);position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--orange);border-radius:0 0 28px 28px}
header img{width:104px;height:104px;border-radius:50%;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.25);background:#fff}
h1{margin:10px 0 6px;color:#fff;font-size:32px;letter-spacing:.2px}
header p{margin:2px 0;color:#e6ebfa}
#total{display:inline-block;background:var(--orange);color:#fff;font-weight:700;border-radius:999px;padding:2px 16px;margin:4px 0 8px}
.note{background:#fff8ec;border:1px solid #f3d6a6;border-right:5px solid var(--orange);border-radius:12px;padding:12px 14px;margin:16px 0;font-size:15px}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.search{width:100%;padding:14px 16px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(31,41,55,.06);outline:none}
.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(66,93,174,.18)}
.chips{display:flex;gap:8px;margin:10px 0 4px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex:0 0 auto;font:inherit;font-size:14.5px;padding:8px 15px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--mute);min-height:40px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(66,93,174,.35)}
.count{color:var(--mute);margin:8px 2px 12px;font-size:14px}
.list{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.list{grid-template-columns:1fr 1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 2px 10px rgba(31,41,55,.05);border-right:5px solid var(--orange);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(31,41,55,.10)}
.badge{align-self:flex-start;font-size:12.5px;color:#9a5b00;background:#fdecd0;border-radius:999px;padding:2px 12px;font-weight:600}
.name{margin:8px 0 4px;color:var(--teal);font-size:19px;line-height:1.4}
.d{margin:3px 0;color:var(--mute);font-size:15px}
.phones{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:12px}
.call{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:600;direction:ltr;box-shadow:0 3px 8px rgba(66,93,174,.3)}
.call::before{content:"\260E";font-size:16px}
.call:active{background:var(--blue2)}
footer{margin-top:30px;color:var(--mute);font-size:14px;text-align:center}
</style>
</head>

<script>
let cat='الكل';
const cats=['الكل',...new Set(businesses.map(b=>b.category))];
const $=id=>document.getElementById(id);
$('total').textContent=businesses.length+' نشاط';
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function render(){
  const q=$('q').value.trim();
  const shown=businesses.filter(b=>(cat==='الكل'||b.category===cat)&&(!q||[b.name,b.category,b.detail,b.address||''].join(' ').includes(q)));
  const ch=$('chips');ch.textContent='';
  cats.forEach(c=>{const b=el('button',c===cat?'chip on':'chip',c);b.type='button';b.onclick=()=>{cat=c;render()};ch.appendChild(b)});
  $('count').textContent=shown.length+' نشاط';
  const l=$('list');l.textContent='';
  shown.forEach(b=>{
    const c=el('div','card');
    c.appendChild(el('span','badge',b.category));
    c.appendChild(el('h3','name',b.name));
    c.appendChild(el('p','d',b.detail));
    if(b.address)c.appendChild(el('p','d','العنوان: '+b.address));
    if(b.phones&&b.phones.length){const p=el('div','phones');b.phones.forEach(n=>{const a=el('a','call',n);a.href='tel:'+n;p.appendChild(a)});c.appendChild(p)}
    else c.appendChild(el('p','d','مفيش رقم مكتوب في التعليق'));
    l.appendChild(c)});
  if(!shown.length)l.appendChild(el('p','d','مفيش نتائج. جرّب كلمة تانية.'));
}
$('q').addEventListener('input',render);
render();
</script>
